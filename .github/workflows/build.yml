name: Build Thanya Online APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q ThanyaOnlineAndroidProject.zip -d project
          cd project
          ROOT=$(find . -name settings.gradle -type f -print -quit)
          ROOT_DIR=$(dirname "$ROOT")
          echo "PROJECT_ROOT=$ROOT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThanyaOnline-APK
          path: project/**/build/outputs/apk/debug/*.apk
