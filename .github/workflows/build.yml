name: Build Android APK From ZIP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بأي وقت من الهاتف

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          # البحث عن أي ملف ZIP في المستودع وفك ضغطه تلقائياً
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found in the repository!"
            exit 1
          fi
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d .

      - name: Detect Project Directory and Setup Gradle Wrapper
        run: |
          # البحث التلقائي عن المجلد المكتمل الذي يحتوي على إعدادات الأندرويد
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle" | head -n 1))
          echo "Android project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # توليد ملفات وتشغيل Gradle بالسيرفر
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          
          # حفظ المسار للخطوات التالية
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanyaOnline-Debug-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
