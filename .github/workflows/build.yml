name: Build Thanya Online APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q ThanyaOnlineAndroidProject.zip -d project

      - name: Remove unnecessary dependency
        run: |
          sed -i "/androidx.appcompat:appcompat/d" project/ThanyaOnlineAndroid/app/build.gradle
          sed -i 's/Theme.AppCompat.NoActionBar/Theme.Material.NoActionBar/' project/ThanyaOnlineAndroid/app/src/main/res/values/styles.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project/ThanyaOnlineAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThanyaOnline-APK
          path: project/ThanyaOnlineAndroid/app/build/outputs/apk/debug/*.apk
